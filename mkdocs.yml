    - Kapitel 02 - Grundlagen der Datenbanken: '02_grundlagen.md'
    - Kapitel 03 - Datenbanken modellieren: '03_modellieren.md'
    - Kapitel 04 - Datenbanken anlegen: '04_anlegen.md'
    - Kapitel 05 - Datenbanken abfragen: '05_abfragen.md'
    - Kapitel 06 - Datenbanken und ihre Inhalte ändern: '06_aendern.md'